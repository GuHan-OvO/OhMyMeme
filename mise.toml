min_version = '2026.8.0'

[tools]
python = '3.12'
node = '22'
npm = '10.9.8'

[env]
_.python.venv = { path = '.venv', create = true }
PYTHONPATH = 'src'

[settings]
lockfile = true
task.run_auto_install = false

[tasks.setup]
description = 'Install Python and Node dependencies'
tools = { python = '3.12', node = '22', npm = '10.9.8' }
run = [
  'python -m pip install --upgrade pip',
  'python -m pip install -r requirements-dev.txt',
  'npm ci',
]

[tasks.run]
description = 'Run OhMyMeme from source'
tools = { python = '3.12' }
run = 'python -m ohmymeme'

[tasks.test]
description = 'Run the Python test suite'
tools = { python = '3.12' }
run = 'python -m pytest tests/ -v'

[tasks.test-python]
description = 'Run the Python test suite or selected tests'
tools = { python = '3.12' }
run = 'python -m pytest'

[tasks.typecheck-python]
description = 'Type check the strict Python migration scope'
tools = { python = '3.12' }
run = 'basedpyright'

[tasks.test-contracts]
description = 'Run architecture and compatibility contract tests'
tools = { python = '3.12' }
run = 'python -m pytest tests/contracts tests/architecture -q'

[tasks.generate-schemas]
description = 'Generate deterministic bridge JSON Schema and TypeScript DTOs'
tools = { python = '3.12', node = '22', npm = '10.9.8' }
run = 'python scripts/generate_bridge_schemas.py'

[tasks.task-19-evidence]
description = 'Record Todo 19 bridge contract evidence outside the worktree'
tools = { python = '3.12', node = '22', npm = '10.9.8' }
run = 'python -m scripts.build_task_19_evidence'

[tasks.freeze-baseline]
description = 'Freeze Todo 1 public contract evidence outside the worktree'
tools = { python = '3.12' }
run = 'python scripts/freeze_baseline.py'

[tasks.build-release-catalog]
description = 'Build Todo 2 external release and migration fixture catalog'
tools = { python = '3.12' }
run = 'python scripts/build_release_catalog.py'

[tasks.resolve-plan-refs]
description = 'Resolve current plan references through Todo 1 inventory evidence'
tools = { python = '3.12' }
run = 'python scripts/resolve_plan_refs.py'

[tasks.recovery-evidence]
description = 'Run Todo 4 recovery faults and record external evidence'
tools = { python = '3.12' }
run = 'python scripts/build_task_4_evidence.py'

[tasks.lan-v1-oracle]
description = 'Validate the LAN v1 wire oracle'
tools = { python = '3.12' }
run = 'python -m pytest tests/protocol/test_lan_v1_protocol.py -q'

[tasks.task-17-evidence]
description = 'Record Todo 17 loopback LAN evidence outside the worktree'
tools = { python = '3.12' }
run = 'python -m scripts.run_task_17_evidence'

[tasks.lint]
description = 'Check Python lint and formatting'
tools = { python = '3.12' }
run = [
  'ruff check src/',
  'black --check src/',
]

[tasks.format]
description = 'Format Python sources'
tools = { python = '3.12' }
run = 'black src/'

[tasks.frontend]
description = 'Build the Vue frontend'
tools = { node = '22', npm = '10.9.8' }
run = 'npm run build'

[tasks.typecheck-frontend]
description = 'Type check the strict frontend migration scope'
tools = { node = '22', npm = '10.9.8' }
run = 'npm run typecheck'

[tasks.test-frontend]
description = 'Run frontend unit tests'
tools = { node = '22', npm = '10.9.8' }
run = 'npm run test'

[tasks.build-frontend]
description = 'Build the Vue frontend'
tools = { node = '22', npm = '10.9.8' }
run = 'npm run build'

[tasks.e2e]
description = 'Run Playwright browser tests'
tools = { node = '22', npm = '10.9.8' }
depends = ['build-frontend']
run = [
  'npm exec playwright install chromium',
  'npm run test:e2e',
]

[tasks.check]
description = 'Run all quality gates'
run = [
  'mise run lint',
  'mise run typecheck-python',
  'mise run test-python',
  'mise run typecheck-frontend',
  'mise run test-frontend',
  'mise run test-contracts',
  'mise run build-frontend',
  'mise run e2e',
  'mise run package-smoke',
]

[tasks.build]
description = 'Build the application package'
tools = { python = '3.12' }
run = 'python scripts/build.py'

[tasks.package-smoke]
description = 'Validate package contracts without building artifacts'
tools = { python = '3.12' }
run = 'python -m scripts.package_smoke'

[tasks.package-smoke-evidence]
description = 'Record Todo 6 package smoke evidence outside the worktree'
tools = { python = '3.12' }
run = 'python -m scripts.build_task_6_evidence'

[tasks.task-9-evidence]
description = 'Record Todo 9 operation coordination evidence outside the worktree'
tools = { python = '3.12' }
run = 'python -m scripts.build_task_9_evidence'

[tasks.task-10-evidence]
description = 'Record Todo 10 atomic file repository evidence outside the worktree'
tools = { python = '3.12' }
run = 'python -m scripts.build_task_10_evidence'

[tasks.task-11-evidence]
description = 'Record Todo 11 configuration compatibility evidence outside the worktree'
tools = { python = '3.12' }
run = 'python -m scripts.build_task_11_evidence'

[tasks.task-12-evidence]
description = 'Record Todo 12 SQLite compatibility evidence outside the worktree'
tools = { python = '3.12' }
run = 'python -m scripts.build_task_12_evidence'

[tasks.task-14-evidence]
description = 'Record Todo 14 manifest and pull-commit evidence outside the worktree'
tools = { python = '3.12' }
run = 'python -m scripts.build_task_14_evidence'

[tasks.task-15-evidence]
description = 'Record Todo 15 atomic image import evidence outside the worktree'
tools = { python = '3.12' }
run = 'python -m scripts.build_task_15_evidence'

[tasks.task-16-evidence]
description = 'Record Todo 16 local remote verification evidence outside the worktree'
tools = { python = '3.12' }
run = 'python -m scripts.build_task_16_evidence'

[tasks.test-remote-contracts-local]
description = 'Run Todo 16 loopback FTP/WebDAV/S3/R2 wire contract tests'
tools = { python = '3.12' }
run = 'python -m scripts.local_remote_contracts'

[tasks.task-18-evidence]
description = 'Record Todo 18 external adapter and FetchPolicy evidence outside the worktree'
tools = { python = '3.12' }
run = 'python -m scripts.build_task_18_evidence'
